    <style>
        
        .dropdown-results {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 250px;
            max-width: 400px;
            /* max width for larger screens */
            background-color: #fff;
            /* color: white; */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            overflow-y: auto;
            /* scroll if too many results */
            max-height: 300px;
            /* max height for scroll */
            z-index: 1000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dropdown-results .result-item  {
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            /* color: white; */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease;
        }

        /* Last item: no border */
        .dropdown-results .result-item:last-child {
            border-bottom: none;
        }

        /* Hover effect */
        .dropdown-results .result-item:hover {
            background-color: #e3f2fd;
            padding-left: 18px; 
            cursor: pointer;
        }

        .back-btn {
            text-transform: none;
            color: var(--main-colour);
        }

        #colour-themes {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            user-select: none;
            cursor: default;
        }

        .colour-theme {
            border-radius: 50%;
            flex: 0 0 1.5rem;
            cursor: pointer;
            text-align: center;
            cursor: pointer;
        }

        .colour-theme.current {
            outline: solid black 2px;
        }

        form > .row {
            margin: 0;
        }

        #form-card {
            display: flex;
            justify-content: space-around;
            .card {
                flex: 0 0 max-content;
            }
        }
        </style>

    <script>
        function populateColourThemes() {
            const colourThemesContainer = document.getElementById("colour-themes");
            const allColours = cm.availableColours();
            let colourIndex = 0;
            for (const colour of allColours) {
                const newColour = document.createElement("div");
                newColour.classList.add("colour-theme");
                newColour.dataset.colourIdx = colourIndex;
                newColour.dataset.colourVal = colour.val;
                newColour.style.backgroundColor = colour.val;
                newColour.style.color = colour.textColour;
                if (cm.currentColour() == colourIndex) {
                    newColour.classList.add("current");
                }
                newColour.innerHTML = "&nbsp;";
                newColour.setAttribute("title", colour.name);
                const pickerHandler = function () {
                    return function () {
                        const currentColour = document.querySelector(".colour-theme.current");
                        currentColour?.classList.remove("current");
                        newColour.classList.add("current");
                        cm.pickColour(newColour.dataset.colourIdx)
                    }
                }
                newColour.addEventListener("click", pickerHandler())
                colourThemesContainer.appendChild(newColour);
                colourIndex++;
            }
        }

        populateColourThemes();

    </script>
    <script>
        let profileDropdown;
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(function () {
                let flashMessages = document.querySelectorAll(".flash-message, .errors");
                flashMessages.forEach(msg =>  timeout_flash(msg));
                setTimeout(() => {
                    const flashContainer = document.querySelector(".flash-messages");
                    flashContainer?.remove();
                }, 2000);
            }, 3000);
            profileDropdown = document.getElementById("profile-dropdown");
            document.addEventListener("click", (e) => {
                if (e.target.classList.contains("user-dropdown") || clickInto(profileDropdown.getBoundingClientRect(), e)) {
                    return;
                }
                hideProfileDropdown();
            })

            function clickInto(boundingRect, mouseEvt) {
                return (mouseEvt.clientX >= boundingRect.x && mouseEvt.clientX <= boundingRect.x + boundingRect.width) &&
                    (mouseEvt.clientY >= boundingRect.y && mouseEvt.clientY <= boundingRect.y + boundingRect.height);
            }
            const selected_nav_tab = document.getElementById("{% block selected %}{% endblock %}");
            if (selected_nav_tab) {
                selected_nav_tab.classList.add("selected");
            }
            M.AutoInit();
            //{% block content_loaded %}{% endblock %}
        });

        function timeout_flash(flash) {
                if (!(flash instanceof HTMLElement)) {
                    flash = document.getElementById("flash-message-" + flash);
                }
                flash.style.opacity = "0";
                // setTimeout(() => (flash.style.display = "none"), 500);
                setTimeout(() => flash.remove(), 500);
        }

        function showProfileDropdown() {
            if (profileDropdown)
                profileDropdown.style.display = "block";
        }

        function hideProfileDropdown() {
            if (!profileDropdown || profileDropdown.style.display !== "block") {
                return;
            } 
            profileDropdown.style.display = "none";
        }
    </script>
