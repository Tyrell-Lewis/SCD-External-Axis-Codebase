<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <main>

      <section id="login-view">
        <h1>Sign In</h1>
        <form id="login-form">
          <label for="email">Email f</label>
          <input id="email" type="email" autocomplete="username" required>
          
          <label for="password">Password </label>
          <input id="password" type="passwod" autocomplete="current-pasword" required>

          <button id="login-btn" type="submit"> Sign In</button>
          <p id="login-error" role="alert" hidden></p>
        </form>
      </section>

      <section id="signed-in-view" hidden>
        <p>Signed in as <strong id="who"></strong>! </p>
        <button id="logout-btn" type="button"> Sign Out</button>
      </section>

    </main>

    <script type="module" src="js/login.js"></script>

  </body>
</html>
